for(let i=0;i<p.count;i++){const e=D.h[i];p.setY(i,Math.max(e,0)*S*VX);let c;
if(e<=0.5)c=[.35,.55,.7];else if(e<40)c=[.55,.68,.45];else if(e<500)c=[.25,.45,.28];else if(e<1100)c=[.35,.42,.33];else c=[.9,.92,.95];col.push(...c);}
g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.computeVertexNormals();
sc.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true})));
const at=(u,v)=>{const x=(u-.5)*W,zz=(v-.5)*H;const e=D.h[Math.min(N-1,Math.floor(v*N))*N+Math.min(N-1,Math.floor(u*N))];return new THREE.Vector3(x,Math.max(e,0)*S*VX,zz);};
const tg=new THREE.Group(),tm=new THREE.MeshLambertMaterial({color:0xb5651d});
for(const [u,v,hh] of D.towers){const b=new THREE.Mesh(new THREE.BoxGeometry(.9,hh*S*VX,.9),tm);const q=at(u,v);b.position.set(q.x,q.y+hh*S*VX/2,q.z);tg.add(b);}sc.add(tg);
document.getElementById('t').onchange=e=>tg.visible=e.target.checked;
const L=D.labels.map(l=>{const d=document.createElement('div');d.className='l';d.textContent=l.name;document.body.appendChild(d);return [d,at(l.u,l.v).add(new THREE.Vector3(0,4,0))];});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);});
(function a(){requestAnimationFrame(a);oc.update();r.render(sc,cam);for(const [d,v] of L){const s=v.clone().project(cam);d.style.display=s.z<1?'block':'none';d.style.left=(s.x+1)/2*innerWidth+'px';d.style.top=(1-s.y)/2*innerHeight+'px';}})();
</script></body></html>
